[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:backend]
; python:3.11-slim 官方镜像的 python3 位于 /usr/local/bin，uvicorn 与全部依赖都在
; 同一 prefix 下的 site-packages，因此必须用 /usr/local/bin/python3
; 降权：supervisord 以 root 启动，仅本 program 切到 app 用户（固定 UID 10001，
; 镜像内由 Dockerfile 创建）。nginx 必须保持 root master（绑定 80 / 写 /var/log/nginx）。
user=app
; HOME 必须指向 app 自己的家目录：ChromaDB 默认 embedding 模型的缓存路径由
; Path.home() 推导，若沿用 root 的 HOME=/root，降权后读不到已预热的模型。
environment=HOME="/home/app"
; --forwarded-allow-ips 必须收紧到 127.0.0.1：原值 `*` 表示「信任任何来源的
; X-Forwarded-* 头」，于是 uvicorn 会用请求头里的假值重写 scope["client"]，
; 连 request.client.host 这个兜底都变成攻击者可控。本进程只监听 127.0.0.1，
; 唯一合法的转发来源就是同容器的 nginx，收紧后不影响正常反代。
command=/usr/local/bin/python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=127.0.0.1
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
