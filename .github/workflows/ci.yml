name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 语法编译检查
        working-directory: backend
        run: python -m compileall -q app

      - name: 用例静态门禁（硬编码地址 / 恒真断言 / F 类缺陷 / 时间契约）
        # 这几类共同点：**本地默认环境下完全看不出来**，只在换端口、
        # 换环境或走到特定分支时才炸，且症状伪装成业务 bug
        # （401 / 报告可生成但实际失败 / NameError / 时区假失败）。
        # 放到这里是为了把它们从「35 分钟后全量才发现」提前到「30 秒静态扫描」。
        run: |
          python tools/check_hardcoded_host.py
          python tools/check_weak_assertion.py
          python tools/check_time_contract.py
          pip install -q ruff
          python tools/lint_gate.py

      - name: 应用导入与建表检查
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./data/ci_test.db
          LLM_ENABLED: 'false'
        run: |
          python -c "
          from app.main import app
          from app.core.database import Base, engine
          Base.metadata.create_all(bind=engine)
          print('路由数量:', len(app.routes))
          print('建表成功')
          "

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm install

      - name: 模板引用静态普查（白屏隐患）
        # 模板调用 script 中未定义的标识符 → 浏览器 "$setup.xxx is not a
        # function" → 整页白屏且无提示，构建期必须拦住
        run: python tools/scan_vue_refs.py

      - name: 复制粘贴残留普查（重复按钮/同开弹窗）
        # 编辑时误用 replace_all 会把整块模板复制成两份，页面出现两个同名
        # 按钮或点开一个弹两个，但 build 与 lint 全部通过
        run: python tools/scan_vue_dup.py

      - name: res.data.data 陷阱普查（列表恒空/统计恒0）
        # axios 拦截器已返回信封，组件里 res.data 即业务数据；
        # res.data.data 恒为 undefined，导致列表空、统计 0、详情打不开。
        # 曾在全站 18 文件 52+ 处踩坑（详见 tools/fix_data_data_all.py）
        run: python tools/check_data_data.py

      - name: 构建
        working-directory: frontend
        run: npm run build

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: unified
          push: false
          tags: edu-ai-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: 端到端回归（210项）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建被测镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: unified
          push: false
          load: true
          tags: edu-ai-platform:e2e
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动服务
        run: |
          docker run -d --name edu-e2e \
            -p 8080:80 \
            -e LLM_ENABLED=false \
            -e SCHEDULER_ENABLED=false \
            -e SECRET_KEY=ci_secret_key_for_e2e_only_not_for_prod \
            -v "${{ github.workspace }}/data:/app/data" \
            edu-ai-platform:e2e

      - name: 等待健康检查
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health; then
              echo ""
              echo "服务就绪"
              exit 0
            fi
            echo "等待中... ($i/60)"
            sleep 2
          done
          echo "服务启动超时"
          docker logs edu-e2e
          exit 1

      - name: 配置测试端口
        run: |
          # e2e_framework 优先读 .env 的 HOST_PORT，CI 中固定为 8080
          echo "HOST_PORT=8080" >> .env
          echo "E2E_BASE=http://localhost:8080" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行端到端测试（三阶段：admin → teacher → student）
        run: python tests/run_all.py

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: tests/E2E_REPORT.md
          retention-days: 30

      - name: 打印失败用例与服务日志
        if: failure()
        run: |
          echo "===== 服务日志 ====="
          docker logs edu-e2e --tail 200
          echo "===== 用例失败明细见上方输出与报告附件 ====="
