name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 语法编译检查
        working-directory: backend
        run: python -m compileall -q app

      - name: 用例静态门禁（硬编码地址 / 恒真断言 / F 类缺陷 / 时间契约 / 模型输出写外键）
        # 这几类共同点：**本地默认环境下完全看不出来**，只在换端口、
        # 换环境或走到特定分支时才炸，且症状伪装成业务 bug
        # （401 / 报告可生成但实际失败 / NameError / 时区假失败）。
        # 放到这里是为了把它们从「35 分钟后全量才发现」提前到「30 秒静态扫描」。
        run: |
          python tools/check_hardcoded_host.py
          python tools/check_weak_assertion.py
          python tools/check_time_contract.py
          python tools/check_model_fk.py
          pip install -q ruff
          python tools/lint_gate.py

      - name: 应用导入与建表检查
        # ⚠️ 这一步曾经**靠一个无关的副作用**才能通过：`core/logger.py` 默认
        # 启用 loguru FileSink，路径 `./data/logs/...`，loguru 会 makedirs 整个
        # 路径 → `./data/` 被顺手建出来 → `create_all` 才能建库。
        # 把 FileSink 改成默认关闭后 `./data` 没人建了，这里立刻报
        # `unable to open database file` —— SQLite **不会**自动创建父目录。
        #
        # 现在两处都改对了：`core/database.py` 在建引擎时自己保证父目录
        # （根治，任何入口都成立）；这里也显式 mkdir，让本步骤不依赖任何
        # 隐藏副作用。以后若有人再「优化」掉其中一处，另一处仍能兜住，
        # 且这次失败会明确指向目录问题而不是伪装成数据库故障。
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./data/ci_test.db
          LLM_ENABLED: 'false'
        run: |
          mkdir -p data
          python -c "
          from app.main import app
          from app.core.database import Base, engine
          Base.metadata.create_all(bind=engine)
          print('路由数量:', len(app.routes))
          print('建表成功')
          "


  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm install

      - name: 模板引用静态普查（白屏隐患）
        # 模板调用 script 中未定义的标识符 → 浏览器 "$setup.xxx is not a
        # function" → 整页白屏且无提示，构建期必须拦住
        run: python tools/scan_vue_refs.py

      - name: 复制粘贴残留普查（重复按钮/同开弹窗）
        # 编辑时误用 replace_all 会把整块模板复制成两份，页面出现两个同名
        # 按钮或点开一个弹两个，但 build 与 lint 全部通过
        run: python tools/scan_vue_dup.py

      - name: res.data.data 陷阱普查（列表恒空/统计恒0）
        # axios 拦截器已返回信封，组件里 res.data 即业务数据；
        # res.data.data 恒为 undefined，导致列表空、统计 0、详情打不开。
        # 曾在全站 18 文件 52+ 处踩坑
        run: python tools/check_data_data.py

      - name: 单元测试（vitest）
        # 33 个断言，锁三处回归：
        #   date.test.js        —— Safari 解析 "YYYY-MM-DD HH:mm:ss" 与东八区口径
        #   paperWizard.test.js —— AI 组卷按钮恒灰的回归锁
        #   sanitize.test.js    —— 存储型 XSS 白名单
        # 2026-10-29 之前这三份只存在于本地，CI 从未执行过 `npm test`；
        # 后端测试体系移除后补上，是当前唯一的自动化行为断言。
        working-directory: frontend
        run: npm test

      - name: 构建
        working-directory: frontend
        run: npm run build

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: unified
          push: false
          tags: edu-ai-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
