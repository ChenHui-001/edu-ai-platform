name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 语法编译检查
        working-directory: backend
        run: python -m compileall -q app

      - name: 用例静态门禁（硬编码地址 / 恒真断言 / F 类缺陷 / 时间契约 / 模型输出写外键）
        # 这几类共同点：**本地默认环境下完全看不出来**，只在换端口、
        # 换环境或走到特定分支时才炸，且症状伪装成业务 bug
        # （401 / 报告可生成但实际失败 / NameError / 时区假失败）。
        # 放到这里是为了把它们从「35 分钟后全量才发现」提前到「30 秒静态扫描」。
        run: |
          python tools/check_hardcoded_host.py
          python tools/check_weak_assertion.py
          python tools/check_time_contract.py
          python tools/check_model_fk.py
          pip install -q ruff
          python tools/lint_gate.py

      - name: 应用导入与建表检查
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./data/ci_test.db
          LLM_ENABLED: 'false'
        run: |
          python -c "
          from app.main import app
          from app.core.database import Base, engine
          Base.metadata.create_all(bind=engine)
          print('路由数量:', len(app.routes))
          print('建表成功')
          "

      - name: 离线单元回归（真实 IP 取值 / 异地登录判定）
        # 这两项各有一半在反代拓扑下**无法端到端验证**：nginx 的
        # `proxy_set_header X-Real-IP $remote_addr` 会把客户端自带的头覆盖成
        # 容器看到的对端地址，e2e 里塞的探针 IP 到不了应用层；异地登录判据是
        # 「本次 IP != 上次 IP」，IP 被统一后也造不出「两地」。
        # 于是 e2e 只断言「伪造值没入库」这个拓扑无关的性质，取值优先级与
        # 告警判据在这一层用构造的 Request / 直接调 authenticate() 精确断言。
        working-directory: backend
        env:
          LLM_ENABLED: 'false'
          SCHEDULER_ENABLED: 'false'
        run: python ../tests/test_unit_ip_login.py

      - name: 离线单元回归（排名语义 / 索引可用性 / 日报时间窗）
        # 这一类性质在 e2e 里**测不出来**，与上一步同因但角度不同：
        # - 排名对拍：e2e 的学生都有班级，永远走不到「本人不在 peers 中」
        #   的末位兜底分支，而语义偏差恰好只在这一分支暴露；
        # - 索引可用性：`func.date(submit_time)` 与半开区间的结果完全一致，
        #   只有看发出的 SQL 才知道索引是否被函数包裹破坏；
        # - 日报零点边界：取决于运行时刻，正常回归几乎不可能落在零点整。
        working-directory: backend
        env:
          LLM_ENABLED: 'false'
          SCHEDULER_ENABLED: 'false'
          SECRET_KEY: ci_unit_secret_key_0123456789abcdef
        run: python ../tests/test_unit_perf_batch1.py

      - name: 离线单元回归（任务下发对象状态校验）
        # 锁的是 `create_task` 里两条下发路径的**不对称设计**：
        # - 指定学生不合规 → 报错（教师显式点名的人不能悄悄丢）
        # - 班级里有人不合规 → 静默跳过（批量对象不该被一个人卡死）
        # 这组不对称在 e2e 里测不出来：e2e 的种子数据里没有停用学生，
        # 走不到该分支；且 e2e 断言的是"接口还活着"，证不了"两处都拦住了"。
        # 断言在 fb634bc 之前的版本上有 23 项失败（反控实测），见文件头。
        working-directory: backend
        env:
          LLM_ENABLED: 'false'
          SCHEDULER_ENABLED: 'false'
          SECRET_KEY: ci_unit_secret_key_0123456789abcdef
        run: python ../tests/test_unit_task_assign.py

      - name: 离线单元回归（强制改密拦截 / 拒绝新旧密码相同）
        # S5（存量库出厂口令强制改密）的**唯一**失效路径：
        # `change_password` 曾不比对 old != new，而 `/auth/password` 必须在
        # 强制改密白名单里（否则改密闭环无解）。两者叠加 = 公开口令登录 →
        # 把新密码设成同一个 → 标记被清 → 继续用公开口令，2 个请求通关。
        #
        # 这组断言只能在这一层：e2e 服务端以 MUST_CHANGE_PASSWORD_ENFORCED=false
        # 启动（否则 99 处共用硬编码口令的 login 全红），拦截在 e2e 里不生效；
        # 且 e2e 不能真改密码（会让"当前密码"在 100+ 个实例间漂移）。
        # 断言在修复前的版本上有 6 项失败（反向验证实测），见文件头。
        working-directory: backend
        env:
          LLM_ENABLED: 'false'
          SCHEDULER_ENABLED: 'false'
          DEBUG: 'false'
          SECRET_KEY: ci_unit_secret_key_0123456789abcdef
        run: python ../tests/test_unit_must_change_pwd.py

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm install

      - name: 模板引用静态普查（白屏隐患）
        # 模板调用 script 中未定义的标识符 → 浏览器 "$setup.xxx is not a
        # function" → 整页白屏且无提示，构建期必须拦住
        run: python tools/scan_vue_refs.py

      - name: 复制粘贴残留普查（重复按钮/同开弹窗）
        # 编辑时误用 replace_all 会把整块模板复制成两份，页面出现两个同名
        # 按钮或点开一个弹两个，但 build 与 lint 全部通过
        run: python tools/scan_vue_dup.py

      - name: res.data.data 陷阱普查（列表恒空/统计恒0）
        # axios 拦截器已返回信封，组件里 res.data 即业务数据；
        # res.data.data 恒为 undefined，导致列表空、统计 0、详情打不开。
        # 曾在全站 18 文件 52+ 处踩坑（详见 tools/fix_data_data_all.py）
        run: python tools/check_data_data.py

      - name: 构建
        working-directory: frontend
        run: npm run build

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: unified
          push: false
          tags: edu-ai-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: 端到端回归（210项）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建被测镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: unified
          push: false
          load: true
          tags: edu-ai-platform:e2e
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 强制改密开关：必须同时喂给「服务进程」和「测试进程」----
      # 服务端为什么设 false：e2e 的 99 处 `.login()` 共用硬编码口令常量，
      # 无法携带真实改密流程。开关默认 true，生产不注入即保持拦截；
      # `change_password` 拒绝 new==old 是**无条件**的，不受此开关影响。
      # 测试进程为什么也要：`test_requirements.py` 里「未改密访问业务接口」
      # 那条断言按开关取值分支（403 / 200 都是被测行为）。测试进程与服务进程
      # 是两个独立进程（这里还隔着 docker），宿主机读不到容器的 `-e`；少注入
      # 一处就会按默认 true 期望 403、实际 200 → 必红。
      # 故在**这一步单点定义**（写入 $GITHUB_ENV），下面两处都取同一个值。
      - name: 定义强制改密开关取值
        run: echo "MUST_CHANGE_PASSWORD_ENFORCED=false" >> "$GITHUB_ENV"

      - name: 启动服务
        run: |
          docker run -d --name edu-e2e \
            -p 8080:80 \
            -e LLM_ENABLED=false \
            -e SCHEDULER_ENABLED=false \
            -e MUST_CHANGE_PASSWORD_ENFORCED="$MUST_CHANGE_PASSWORD_ENFORCED" \
            -e SECRET_KEY=ci_secret_key_for_e2e_only_not_for_prod \
            -v "${{ github.workspace }}/data:/app/data" \
            edu-ai-platform:e2e

      - name: 等待健康检查
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health; then
              echo ""
              echo "服务就绪"
              exit 0
            fi
            echo "等待中... ($i/60)"
            sleep 2
          done
          echo "服务启动超时"
          docker logs edu-e2e
          exit 1

      - name: 配置测试端口
        run: |
          # e2e_framework 优先读 .env 的 HOST_PORT，CI 中固定为 8080
          echo "HOST_PORT=8080" >> .env
          echo "E2E_BASE=http://localhost:8080" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行端到端测试（三阶段：admin → teacher → student）
        run: python tests/run_all.py

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: tests/E2E_REPORT.md
          retention-days: 30

      - name: 打印失败用例与服务日志
        if: failure()
        run: |
          echo "===== 服务日志 ====="
          docker logs edu-e2e --tail 200
          echo "===== 用例失败明细见上方输出与报告附件 ====="
