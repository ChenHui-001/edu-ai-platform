name: Docker 镜像发布

# ============================================================================
# 发版一致性契约（本工作流的存在意义）
#
# 版本号与代码在发布链路上有五个落点，任何一个脱节都**不会自己报错**：
#   ① 根目录 VERSION                  <- 唯一真源
#   ② commit -> origin/master         <- 代码离开本机的唯一通道
#   ③ 镜像内 /app/VERSION + BUILD_INFO <- 镜像里的版本与 commit 快照
#   ④ 镜像标签 repo:x.y.z             <- 人为命名，不复核内容
#   ⑤ /health 的 settings.APP_VERSION <- 运行时可观测值
#
# 本工作流的四道闸门依次锁死上述落点：
#   [闸门1] 触发前：分支名必须是 master；tag 必须与 VERSION 自洽
#   [闸门2] 构建前：工作区干净 + commit 与 VERSION 记录一致
#   [闸门3] 构建时：把 github.sha 烧进镜像（OCI label + /app/BUILD_INFO）
#   [闸门4] 推送后：回查 registry，确认镜像内的版本与 commit == 本次提交
#
# 历史缺陷（已修复，勿回退）：
#   - 曾写 `branches: [main]`，而本仓库主分支是 master → 工作流从未触发过一次
#   - 曾用 `${{ github.repository }}` 作镜像名 → 推到 ChenHui-001/ 而非 nanpo/，
#     与手工推送的镜像分成两个仓库，导致「仓库里有新版、线上拉到的还是旧版」
#   - 曾有一个只 echo 不推送的「额外推送 latest」死步骤
# ============================================================================

on:
  push:
    tags:
      - 'v*'
    branches:
      # ⚠️ 本仓库主分支是 master（不是 main）。写错会导致工作流静默不触发，
      #    Actions 页面看起来「什么都没发生」，极易被误判为「CI 挂了」。
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空则用 VERSION 文件内容）'
        required: false
        default: ''
      skip_latest:
        description: '不更新 latest（补发旧版本时勾选）'
        type: boolean
        default: false

env:
  # 改用 GitHub Container Registry：使用自动注入的 GITHUB_TOKEN，
  # 无需手工配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 两个 secret。
  # 代价是镜像地址从 nanpo/edu-ai-platform 变为 ghcr.io/chenhui-001/edu-ai-platform，
  # 部署端需同步改 image 引用（用 vars.IMAGE_NAME 可覆盖回 Docker Hub）。
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'chenhui-001/edu-ai-platform' }}

jobs:
  # --------------------------------------------------------------------------
  # 闸门1/2：构建前的一致性校验。任何一项不过就不构建——
  # 构建一个无法溯源的镜像，比不构建更糟（它会静默覆盖线上）。
  # --------------------------------------------------------------------------
  preflight:
    name: 构建前一致性校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
      publish_latest: ${{ steps.ver.outputs.publish_latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验并导出发布元数据
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          SKIP_LATEST: ${{ github.event.inputs.skip_latest }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          commit="$(git rev-parse HEAD)"

          # ---- ① VERSION 必须合法：非法字符会让 docker build 直接失败，
          #      而报错信息完全看不出是 VERSION 的问题
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION 内容不合法（应为 x.y.z）：'$version'"
            exit 1
          fi
          echo "VERSION = $version"

          # ---- ② tag 与 VERSION 自洽：v1.0.41 的 tag 绝不能产出 :1.0.40 镜像
          if [ "$REF_TYPE" = "tag" ]; then
            tag_ver="${REF_NAME#v}"
            if [ "$tag_ver" != "$version" ]; then
              echo "::error::tag '$REF_NAME' 与 VERSION '$version' 不一致。"
              echo "::error::继续发布将打出 :$version 镜像却带 $REF_NAME 的 tag，版本漂移。"
              echo "::error::修正：把 VERSION 改成 $tag_ver 后重新提交并打 tag。"
              exit 1
            fi
            echo "tag 与 VERSION 自洽：$REF_NAME == $version"
          fi

          # ---- ③ 手动指定标签时同样必须与 VERSION 一致（除了 latest/sha 这类非版本标签）
          if [ -n "$INPUT_TAG" ] && printf '%s' "$INPUT_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            input_ver="${INPUT_TAG#v}"
            if [ "$input_ver" != "$version" ]; then
              echo "::error::手动标签 '$INPUT_TAG' 与 VERSION '$version' 不一致，拒绝发布"
              exit 1
            fi
          fi

          # ---- ④ 工作区必须干净：脏工作区构建出的镜像无法与任何 commit 对应
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::工作区有未提交改动，拒绝构建无法溯源的镜像"
            git status --porcelain
            exit 1
          fi

          # ---- ⑤ latest 语义：只在 master（主干，版本必然最新）与手动发布时更新；
          #      补发旧版本 tag 时**不**动 latest，否则 latest 会回退到旧代码
          publish_latest="true"
          if [ "$REF_TYPE" = "tag" ]; then
            publish_latest="false"
          fi
          if [ "$SKIP_LATEST" = "true" ]; then
            publish_latest="false"
          fi

          {
            echo "version=$version"
            echo "commit=$commit"
            echo "publish_latest=$publish_latest"
          } >> "$GITHUB_OUTPUT"

      - name: 检查该版本号是否已发布过
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          NEW_VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 同一个版本号发布两次 = 用相同的版本号承载不同的代码，
          # 这正是「版本号相同、内容不同」那类漂移的源头。
          # 已存在时只告警不阻断（重跑 CI 是正常场景），但会显式记录。
          code=$(curl -s -o /tmp/vers.json -w '%{http_code}' \
                 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/users/${IMAGE_NAME%%/*}/packages/container/${IMAGE_NAME##*/}/versions?per_page=100" || true)
          if [ "$code" != "200" ]; then
            echo "无法查询 ghcr 版本列表（HTTP $code），跳过重复发布检查"
            exit 0
          fi
          python3 - "$NEW_VERSION" <<'PY'
          import json, sys
          want = sys.argv[1]
          try:
              data = json.load(open('/tmp/vers.json'))
          except Exception:
              sys.exit(0)
          hits = []
          for v in (data if isinstance(data, list) else []):
              tags = (v.get('metadata', {}).get('container', {}).get('tags') or [])
              if want in tags:
                  hits.append(v.get('name', ''))
          if hits:
              print(f"::warning::版本 {want} 在 ghcr 已存在（digest {hits[0][:19]}）。")
              print(f"::warning::若本次代码与上次不同，应升版本号而不是覆盖 —— 否则 :{want} 会指向两份不同代码。")
          else:
              print(f"版本 {want} 尚未发布过，正常")
          PY

  # --------------------------------------------------------------------------
  # 构建与推送
  # --------------------------------------------------------------------------
  build-push:
    name: 构建并推送
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推 ghcr 必需；GITHUB_TOKEN 自动具备，无需手工 secret
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # GITHUB_TOKEN 由 Actions 在运行时自动注入，无需在仓库里配任何 secret。
          # 这正是从 Docker Hub 切到 ghcr 的原因：后者需要手工配
          # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，漏配就会在 login 步骤
          # 报 "Username and password required" 而整个发布链路中断。
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.publish_latest == 'true' }}
            type=sha,format=short,prefix=build-
          # 标签统一去掉 v 前缀，与本地 push_dockerhub.sh 的 :1.0.x 保持一致；
          # 版本号唯一真源仍是根目录 VERSION 文件。
          flavor: latest=false

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          target: unified
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 闸门3：把本次 commit 烧进镜像。没有它，「版本号相同但代码不同」
          # 这种情况在事后完全无法识别（1.0.40 可以构建十次、内容各不相同）。
          build-args: |
            APP_VERSION=${{ needs.preflight.outputs.version }}
            GIT_COMMIT=${{ needs.preflight.outputs.commit }}
            BUILD_TIME=${{ github.event.repository.pushed_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 记录镜像 digest，供发布后核对与人工追溯
      - name: 输出镜像 digest
        run: |
          echo "### 发布结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 版本 | \`${{ needs.preflight.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| commit | \`${{ needs.preflight.outputs.commit }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 镜像 | \`${{ env.IMAGE_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| digest | \`${{ steps.meta.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| latest | \`${{ needs.preflight.outputs.publish_latest }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # 闸门4：发布后回查。**不能只信 build-push 的 success**——
  # 推送成功只说明字节传上去了，不说明传上去的是不是这次的代码。
  # --------------------------------------------------------------------------
  postflight:
    name: 发布后一致性核对
    needs: [preflight, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 回查 ghcr，核对镜像内的版本与 commit
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          EXPECT_VERSION: ${{ needs.preflight.outputs.version }}
          EXPECT_COMMIT: ${{ needs.preflight.outputs.commit }}
          PUBLISH_LATEST: ${{ needs.preflight.outputs.publish_latest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request

          repo = os.environ["IMAGE_NAME"]          # 例：chenhui-001/edu-ai-platform
          exp_v = os.environ["EXPECT_VERSION"]
          exp_c = os.environ["EXPECT_COMMIT"]
          want_latest = os.environ.get("PUBLISH_LATEST") == "true"

          def get(url, accept=None, token=None):
              h = {"Accept": accept or "application/json"}
              if token:
                  h["Authorization"] = f"Bearer {token}"
              return urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=60)

          def token_for(repo):
              # ghcr 的匿名拉取令牌。公开包无需其他凭据；
              # 私有包需改用 GITHUB_TOKEN + packages:read，这里按公开包处理。
              u = f"https://ghcr.io/token?scope=repository:{repo}:pull&service=ghcr.io"
              return json.load(get(u))["token"]

          def manifest_of(tag, tk):
              base = f"https://ghcr.io/v2/{repo}"
              acc = ("application/vnd.oci.image.index.v1+json,"
                     "application/vnd.docker.distribution.manifest.list.v2+json,"
                     "application/vnd.oci.image.manifest.v1+json,"
                     "application/vnd.docker.distribution.manifest.v2+json")
              m = json.load(get(f"{base}/manifests/{tag}", acc, tk))
              if "manifests" in m:
                  pick = next((x for x in m["manifests"]
                               if x.get("platform", {}).get("architecture") == "amd64"), None)
                  if pick is None:
                      raise RuntimeError("manifest list 中无 amd64")
                  m = json.load(get(f"{base}/manifests/{pick['digest']}", acc, tk))
              return m

          def snapshot_of(tag, tk):
              """返回 (version, commit)。优先 OCI label，退化读 BUILD_INFO blob。

              label 是构建时由 metadata-action 注入的；BUILD_INFO 由镜像内
              `cat /app/VERSION` 生成。两者都读，任一命中即可 —— 只信 label
              会在「漏传 ARG APP_VERSION」时读到空串而误判。
              """
              m = manifest_of(tag, tk)
              lb = (json.load(get(f"https://ghcr.io/v2/{repo}/blobs/{m['config']['digest']}",
                                  None, tk))["config"].get("Labels") or {})
              ver = lb.get("org.opencontainers.image.version", "")
              com = lb.get("org.opencontainers.image.revision", "")
              if ver and com:
                  return ver, com, "OCI label"

              # 退到镜像层里的 /app/BUILD_INFO：遍历 layer 找该文件
              for layer in m.get("layers", []):
                  url = f"https://ghcr.io/v2/{repo}/blobs/{layer['digest']}"
                  try:
                      raw = get(url, None, tk).read()
                  except Exception:
                      continue
                  data = _extract_file_from_tar(raw, "app/BUILD_INFO")
                  if data:
                      info = dict(
                          ln.split("=", 1) for ln in data.decode(errors="ignore").splitlines()
                          if "=" in ln)
                      return (info.get("version", ""), info.get("commit", ""),
                              "镜像内 /app/BUILD_INFO")
              return ver, com, "OCI label"

          def _extract_file_from_tar(raw, want):
              """从单层 layer 的 tar(.gz) 里取出指定路径的文件内容。

              registry 的 layer 是压缩 tar，可能包住多级目录；只认精确路径。
              """
              import io, tarfile
              for mode in ("r:gz", "r:"):
                  try:
                      with tarfile.open(fileobj=io.BytesIO(raw), mode=mode) as tf:
                          for mem in tf.getmembers():
                              if mem.name.lstrip("./") == want and mem.isfile():
                                  return tf.extractfile(mem).read()
                  except Exception:
                      continue
              return None

          fail, tk = [], token_for(repo)
          tags = [(exp_v, False)] + ([("latest", True)] if want_latest else [])
          for tag, _is_latest in tags:
              try:
                  got_v, got_c, how = snapshot_of(tag, tk)
              except Exception as exc:
                  fail.append(f"读取 {repo}:{tag} 失败：{exc}")
                  continue
              print(f"[{repo}:{tag}] version={got_v!r} revision={got_c!r} 来源={how}")
              if got_v != exp_v:
                  fail.append(f"`{tag}` 镜像内版本={got_v!r}，期望 {exp_v!r}")
              if not got_c.startswith(exp_c[:7]):
                  fail.append(f"`{tag}` 镜像内 commit={got_c!r}，期望 {exp_c[:7]}")

          if fail:
              print("::error::发布后一致性核对未通过")
              for f in fail:
                  print("::error::" + f)
              sys.exit(1)
          print("发布后核对通过：镜像内版本与 commit 均与本次提交一致")
          PY

      - name: 汇总核对结果
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> 发布后已回查 registry：镜像内 \`org.opencontainers.image.version\`" >> "$GITHUB_STEP_SUMMARY"
          echo "> 与 \`revision\` 均与本次提交一致。" >> "$GITHUB_STEP_SUMMARY"
