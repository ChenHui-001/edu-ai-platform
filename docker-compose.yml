# 新芽学堂 · 九年义务教育 AI 学习平台 —— 生产部署编排
# 轻量化单机部署：应用服务 + Nginx，数据库/向量库/存储全部内置
#
# 启动：docker compose up -d
# 访问：http://localhost
# 文档：http://localhost/docs

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: unified
      args:
        DOCKERHUB_REPO: ${DOCKERHUB_REPO:-edu-ai-platform}
        APP_VERSION: ${IMAGE_TAG:-}
        # 构建指纹：start.ps1/start.sh 会导出当前 git commit 与构建时间，
        # 写入镜像内 /app/BUILD_INFO，供「本地镜像是否落后于代码」判断与发版核对。
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    # 镜像来源：**只有 ghcr 一处**（CI 构建的多架构镜像 amd64+arm64）。
    # 本地与服务器拉同一份，sha256 逐字节相同 —— 不再本地编译，
    # 杜绝「同版本号不同内容」的两份镜像漂移。
    image: ${IMAGE_REGISTRY:-ghcr.io/chenhui-001/edu-ai-platform}:${IMAGE_TAG:-latest}
    container_name: edu-platform
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    environment:
      # 版本号（留空则容器内读 /app/VERSION）
      APP_VERSION: ${IMAGE_TAG:-}
      # 数据库
      DATABASE_URL: sqlite:////app/data/edu_platform.db
      # 安全：必须显式提供随机 SECRET_KEY（缺失时 compose 直接报错并中止，
      # 避免用公开占位符签发 JWT 导致任何人都能伪造管理员令牌）。
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 未配置，请先在 .env 中设置至少 32 位随机字符}
      # 生产默认关闭 DEBUG；应用会据此拒绝弱 SECRET_KEY
      DEBUG: ${DEBUG:-false}
      # 大模型（留空则使用规则引擎降级）
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      # 推理型模型（reasoning）的 thinking token 与正文共享 max_tokens 预算，
      # 2048 会被推理吃光导致正文为空 → AI 出题静默降级。默认给足预算。
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      # 业务
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-50}
      # 演示数据：本地体验保留默认 true；生产建议在 .env 设为 false
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      TZ: Asia/Shanghai
    volumes:
      # 数据持久化：**用命名卷，而不是 ./data 绑定挂载**。
      # SQLite 默认 WAL 模式，需要 -wal/-shm 旁文件与 POSIX  advisory 锁。
      # Docker Desktop 的 Windows 绑定挂载（9p / gRPC-FUSE）不完整支持这些语义：
      # 表现是「第一个连接正常、之后任何新连接一律 unable to open database file」，
      # 于是 AI 配置读取（_get_db_value 走独立 SessionLocal）与 AI 调用日志写入
      # （daemon 线程另开连接）静默失败 —— 前者让 LLM 配置读不到而误判「未配置」。
      # 命名卷落在容器所在 Linux 文件系统上，锁语义完整，多连接正常工作。
      - edu-data:/app/data
      # 日志仍留在宿主机，便于直接排查
      - ./logs:/app/data/logs
    # 最小加固：禁止进程通过 setuid/setgid 二进制提权（容器内 root 仍可
    # 主动 setuid 降权给 app 用户，nginx master 照常绑定 80）。
    # 刻意**不**加 cap_drop: [ALL]：supervisord 需要 CHOWN/SETUID/SETGID
    # 才能 chown data 目录并降权拉起 uvicorn，nginx 需要 NET_BIND_SERVICE
    # 才能监听 80；逐个放开反而更容易漏掉某条 capability 导致启动失败，
    # 且当前无法在 CI 里做 docker build/run 验证，故只保留无风险项。
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  # 数据卷（不写 name 时 compose 会按项目名生成 edu-ai-platform_edu-data；
  # 显式命名便于跨项目/跨目录复用同一份数据）
  edu-data:
    name: edu-data
