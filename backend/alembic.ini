# Alembic configuration (Q-06).
#
# !!! KEEP THIS FILE ASCII-ONLY !!!
# alembic reads this file with `configparser.read(..., encoding="locale")`.
# On a Chinese-locale Windows that is GBK, so any UTF-8 Chinese comment makes
# every `alembic` command die with:
#     UnicodeDecodeError: 'gbk' codec can't decode byte 0x80
# The rationale for introducing Alembic (and the rules that come with it)
# lives in `migrations/env.py`, which is a normal .py file and may be Chinese.
#
# Key conventions:
# - The database URL is NOT configured here. `migrations/env.py` reads
#   `settings.DATABASE_URL` so there is exactly one source of truth.
#   `ALEMBIC_DB_URL` overrides it (used by tools/check_alembic_sync.py).
# - `0001_baseline` is autogenerated from the models; never hand-edit it.
# - New revisions: `alembic revision --autogenerate -m "..."` from backend/.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
